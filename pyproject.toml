[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qiantong"
version = "0.1.0"
description = "Temple fortune sticks in the terminal: Guanyin lots (观音灵签), Taiwan's Sixty Jiazi lots, Sensō-ji omikuji, with jiaobei tossing and quantum randomness"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mediapig", email = "ky8contact9@gmail.com" }]
keywords = ["观音灵签", "六十甲子籤", "抽签", "fortune", "omikuji", "divination", "cli", "quantum random"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mediapig/qiantong"
Source = "https://github.com/mediapig/qiantong"
Issues = "https://github.com/mediapig/qiantong/issues"

[project.scripts]
qiantong = "qiantong.cli:main"
chouqian = "qiantong.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qiantong = [
    "data/*.json",
    "_macos/LocationHelper.app/Contents/MacOS/LocationHelper",
    "_macos/LocationHelper.app/Contents/Info.plist",
]
