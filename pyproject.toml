[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "qiantong"
version = "0.1.5"
description = "Temple fortune sticks in the terminal: Guanyin lots (观音灵签), Taiwan's Sixty Jiazi lots, Sensō-ji omikuji, with jiaobei tossing and quantum randomness"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "mediapig", email = "ky8contact9@gmail.com" }]
keywords = ["观音灵签", "六十甲子籤", "抽签", "fortune", "omikuji", "divination", "cli", "quantum random"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Topic :: Games/Entertainment",
]
dependencies = ["rich>=13,<14"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
qiantong = "qiantong.cli:main"
chouqian = "qiantong.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
qiantong = [
    "data/*.json",
    "_macos/LocationHelper.app/Contents/MacOS/LocationHelper",
    "_macos/LocationHelper.app/Contents/Info.plist",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
